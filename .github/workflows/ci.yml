name: CI

on:
  pull_request:
    branches: [main]

jobs:
  web:
    name: "Web — typecheck / lint / test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  etl:
    name: "ETL — mypy / ruff / pytest"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/etl

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Type check
        run: uv run mypy etl/

      - name: Lint
        run: uv run ruff check etl/

      - name: Test
        run: uv run pytest
